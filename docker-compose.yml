services:
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - receipt-redis-data:/data

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: receipt_review
      MYSQL_USER: receipt_user
      MYSQL_PASSWORD: receipt_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - receipt-mysql-data:/var/lib/mysql

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - receipt-prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:1.6.0
    profiles: ["load"]
    working_dir: /scripts
    entrypoint: ["k6"]
    environment:
      BASE_URL: http://host.docker.internal:8080
    volumes:
      - ./load:/scripts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  receipt-mysql-data:
  receipt-redis-data:
  receipt-prometheus-data:

secrets:
  grafana_admin_password:
    file: ./runtime/secrets/grafana_admin_password
