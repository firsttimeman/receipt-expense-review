spring:
  datasource:
    # 서로 다른 Spring 테스트 컨텍스트가 스키마 create-drop으로 간섭하지 않도록 DB 이름을 격리한다.
    url: jdbc:h2:mem:receipt_review_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

receipt:
  worker:
    enabled: false
  extractor:
    provider: fake
