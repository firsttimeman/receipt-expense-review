spring:
  application:
    name: receipt-expense-review
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/receipt_review?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8}
    username: ${DB_USERNAME:receipt_user}
    password: ${DB_PASSWORD:receipt_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

receipt:
  extractor:
    provider: ${RECEIPT_EXTRACTOR_PROVIDER:fake}
  quality:
    min-width: 600
    min-height: 600
  policy:
    max-amount: 300000
    weekend-requires-review: true
    prohibited-merchant-keywords:
      - 유흥
      - 카지노
      - 성인
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}

server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
