spring:
  application:
    name: receipt-expense-review
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/receipt_review?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=utf8}
    username: ${DB_USERNAME:receipt_user}
    password: ${DB_PASSWORD:receipt_password}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

receipt:
  storage:
    local-directory: ${RECEIPT_IMAGE_STORAGE_DIRECTORY:./runtime/receipt-images}
  worker:
    enabled: ${RECEIPT_WORKER_ENABLED:true}
    poll-delay-millis: ${RECEIPT_WORKER_POLL_DELAY_MILLIS:1000}
    lease-duration: ${RECEIPT_WORKER_LEASE_DURATION:60s}
    batch-size: ${RECEIPT_WORKER_BATCH_SIZE:4}
    concurrency: ${RECEIPT_WORKER_CONCURRENCY:4}
    worker-id: ${RECEIPT_WORKER_ID:}
  extractor:
    provider: ${RECEIPT_EXTRACTOR_PROVIDER:fake}
  quality:
    min-width: 600
    min-height: 600
  policy:
    max-amount: 300000
    weekend-requires-review: true
    prohibited-merchant-keywords:
      - 유흥
      - 카지노
      - 성인
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
    base-url: ${OPENAI_BASE_URL:}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:3s}
    response-timeout: ${OPENAI_RESPONSE_TIMEOUT:30s}

server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
